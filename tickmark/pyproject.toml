[project]
name = "tickmark"
version = "0.1.0"
description = "Sample audit agent (invoice vouching) that runs through Warden"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "openpyxl>=3.1",
  "rapidfuzz>=3.9",
  "azure-ai-documentintelligence>=1.0.0",
  "reportlab>=4.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["db: needs the Tickmark Postgres (docker compose up -d)", "llm: calls the LLM API (opt-in: pytest -m llm)"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
